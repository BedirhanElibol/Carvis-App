services:
  # Carvis AI Core (Python FastAPI)
  - type: web
    name: carvis-ai-core
    env: python
    buildCommand: "cd carvis-ai-core && pip install -r requirements.txt"
    startCommand: "cd carvis-ai-core && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # Carvis Partner API (Node.js Express)
  - type: web
    name: carvis-partner-api
    env: node
    buildCommand: "cd carvis-partner-api && npm install"
    startCommand: "cd carvis-partner-api && node src/server.js"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
