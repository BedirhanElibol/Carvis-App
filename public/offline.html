<!DOCTYPE html>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 360px; }
    .icon-wrap {
      width: 96px; height: 96px;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .icon-wrap svg { width: 44px; height: 44px; stroke: #10b981; fill: none; stroke-width: 1.5; }
    h1 {
      font-size: clamp(1.25rem, 5vw, 1.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      line-height: 1.1;
    }
    p {
      color: #94a3b8;
      font-size: clamp(0.875rem, 2vw, 1rem);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      width: 100%;
      background: #10b981;
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .footer {
      margin-top: 2rem;
      font-size: 0.625rem;
      color: #475569;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

  <div class="container">
